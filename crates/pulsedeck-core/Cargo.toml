[package]
name = "pulsedeck-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Protocol, serial session, NAM/IR conversion and uploader for the PulseDeck pedal editor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
crc32fast = "1"
hound = "3"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
futures = "0.3"
uuid = "1"
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
