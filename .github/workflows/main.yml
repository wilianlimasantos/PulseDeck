name: Build Portable (Windows & Linux)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_name: Linux-x64
            bin_name: pulsedeck
          - platform: windows-latest
            os_name: Windows-x64
            bin_name: pulsedeck.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        run: |
          npm ci
          npm run tauri build

      - name: Package Portable ZIP
        shell: bash
        run: |
          mkdir -p portable/PulseDeck-${{ matrix.os_name }}/data
          cp target/release/${{ matrix.bin_name }} portable/PulseDeck-${{ matrix.os_name }}/
          cd portable
          7z a -tzip PulseDeck-${{ matrix.os_name }}-Portable.zip PulseDeck-${{ matrix.os_name }}/

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseDeck-${{ matrix.os_name }}-Portable
          path: portable/PulseDeck-${{ matrix.os_name }}-Portable.zip
