; PulseDeck ESP32 test bench.
;   firmware-core/  chip-independent C++17 (what will later be ported to the AC791N)
;   hal-esp32/      ESP32 hardware layer: LittleFS + NVS flash, buttons, serial
; Host tests (no board):  make -C firmware-core test
[platformio]
src_dir = hal-esp32/src
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 115200
board_build.flash_mode = dout
board_build.filesystem = littlefs
lib_extra_dirs = .
lib_deps = firmware-core
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
