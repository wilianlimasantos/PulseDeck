[package]
name = "pulsedeck"
version = "0.1.0"
edition = "2021"
description = "PulseDeck - open-source editor for the UltraRig guitar pedal"
license = "MIT"

[lib]
name = "pulsedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulsedeck-core = { path = "../crates/pulsedeck-core" }
